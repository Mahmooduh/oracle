version: '3.8'

services:
  oracle-apex:
    build: .
    container_name: oracle21c-apex24
    ports:
      - "1521:1521"
      - "5500:5500"
      - "8080:8080"
    environment:
      - ORACLE_SID=XE
      - ORACLE_PDB=XEPDB1
      - ORACLE_PWD=Oracle123
      - ORACLE_CHARACTERSET=AL32UTF8
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./scripts:/opt/oracle/scripts/startup
    shm_size: 2gb
    restart: unless-stopped

volumes:
  oracle-data:
